name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv build
      - name: Publish to PyPI through trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
  tap:
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
    steps:
      - if: env.BOT_TOKEN != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/homebrew-mcpshape
          token: ${{ secrets.BOT_TOKEN }}
      - name: The tap's formula names the release's source distribution on PyPI
        if: env.BOT_TOKEN != ''
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=${TAG#v}
          for _ in $(seq 1 20); do
            sdist=$(curl --fail --silent --show-error "https://pypi.org/pypi/mcpshape/$version/json" | jq -r '.urls[] | select(.packagetype == "sdist") | "\(.url) \(.digests.sha256)"') && [ -n "$sdist" ] && break
            sleep 15
          done
          if [ -z "$sdist" ]; then
            echo "::error::PyPI does not list a source distribution of mcpshape $version; rerun the failed job from the Actions page once it does"; exit 1
          fi
          read -r url sha <<<"$sdist"
          sed -i "s|^  url \".*\"$|  url \"$url\"|; s|^  sha256 \".*\"$|  sha256 \"$sha\"|" Formula/mcpshape.rb
          if ! grep -q "^  url \"$url\"$" Formula/mcpshape.rb || ! grep -q "^  sha256 \"$sha\"$" Formula/mcpshape.rb; then
            echo "::error::the formula's url and sha256 lines were not rewritten"; exit 1
          fi
          if ! git diff --quiet -- Formula/mcpshape.rb; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "mcpshape $version" -- Formula/mcpshape.rb
            git push
          fi
